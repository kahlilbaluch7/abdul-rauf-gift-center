<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abdul Rauf Gift Center - Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f4f4f4;margin:0;padding:20px}
.container{max-width:650px;margin:auto;background:white;padding:20px;border-radius:12px}
h2{color:#333}
input,select,textarea,button{width:100%;padding:12px;margin:7px 0;box-sizing:border-box;border:1px solid #ccc;border-radius:6px}
button{background:#222;color:white;border:0;cursor:pointer}
.delete{background:#c62828}
.product{border:1px solid #ddd;padding:12px;margin:10px 0;border-radius:8px}
.product img{width:70px;height:70px;object-fit:cover;margin:3px;border-radius:5px}#photoPreview img{width:58px;height:58px;object-fit:cover;margin:4px;border-radius:6px}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
<h2>Abdul Rauf Gift Center</h2>
<h3>Admin Dashboard</h3>

<div id="login">
<h3>Admin Login</h3>
<input id="email" type="email" placeholder="Admin email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div id="dashboard" class="hidden">
<button onclick="logout()">Logout</button>
<hr>
<h3 id="formTitle">Add New Product</h3>
<input id="name" placeholder="Product name">
<input id="price" placeholder="Price (e.g. 500 or 1000-1500)">

<select id="category" required>
<option value="">Select Category</option>
<option value="Cosmetics">Cosmetics</option>
<option value="Sale">Sale</option>
<option value="Gifts">Gifts</option>
<option value="Supplements & Nutrition">Supplements & Nutrition</option>
<option value="Clothing">Clothing</option>
<option value="Other">Other</option>
<option value="Ready to Wear">Ready to Wear</option>
<option value="Watches">Watches</option>
<option value="Perfumes">Perfumes</option>
<option value="Toys">Toys</option>
<option value="Jewelry">Jewelry</option>
<option value="Dupatta">Dupatta</option>
</select>
<select id="audience">
<option value="Women">Women</option>
<option value="Men">Men</option>
<option value="Kids">Kids</option>
<option value="Men Women">Men & Women</option>
<option value="All">All</option>
</select>
  <label>Discount Percentage:</label>
<select id="discountPercent">
<option value="0">No Discount</option>
<option value="10">10% OFF</option>
<option value="20">20% OFF</option>
<option value="30">30% OFF</option>
<option value="40">40% OFF</option>
<option value="50">50% OFF</option>
</select>
<textarea id="description" placeholder="Product description"></textarea>
<label>Product photos (up to 10):</label>
<div id="photoInputs">
<label>Photo 1</label><input id="photo1" type="file" accept="image/*">
<label>Photo 2</label><input id="photo2" type="file" accept="image/*">
<label>Photo 3</label><input id="photo3" type="file" accept="image/*">
<label>Photo 4</label><input id="photo4" type="file" accept="image/*">
<label>Photo 5</label><input id="photo5" type="file" accept="image/*">
<label>Photo 6</label><input id="photo6" type="file" accept="image/*">
<label>Photo 7</label><input id="photo7" type="file" accept="image/*">
<label>Photo 8</label><input id="photo8" type="file" accept="image/*">
<label>Photo 9</label><input id="photo9" type="file" accept="image/*">
<label>Photo 10</label><input id="photo10" type="file" accept="image/*">
</div>
<small>Har photo alag select karein. Maximum 10 photos.</small>
<div id="photoPreview"></div>
<button onclick="saveProduct()">Save Product</button>
<button onclick="clearForm()">Clear Form</button>

<hr>
<h3>All Products</h3>
<div id="products">Loading...</div>
</div>
</div>

<script>
const SUPABASE_URL = "https://eanlsdwzmridqgwjqduu.supabase.co";
const SUPABASE_KEY = "sb_publishable_ZTW3Ebfbz9Va0MRbN1euNg_9nnSuOfZ";
const ADMIN_UID = "2d825d77-df78-4a6d-be1f-d3e7118f6f1f";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let editingId = null;
let existingImageUrls = [];

async function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const {error} = await db.auth.signInWithPassword({email,password});
  if(error){alert(error.message);return;}
  await checkLogin();
}

async function checkLogin(){
  const {data:{user}} = await db.auth.getUser();
  if(user && user.id === ADMIN_UID){
    document.getElementById("login").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
    loadProducts();
  }else{
    await db.auth.signOut();
    document.getElementById("login").classList.remove("hidden");
    document.getElementById("dashboard").classList.add("hidden");
    if(user) alert("This account is not authorized as admin.");
  }
}

async function logout(){
  await db.auth.signOut();
  location.reload();
}

async function loadProducts(){
  const box = document.getElementById("products");
  box.innerHTML = "Loading...";
  const {data,error} = await db.from("products").select("*").order("created_at",{ascending:false});
  if(error){box.innerHTML = error.message;return;}
  if(!data.length){box.innerHTML = "No products yet.";return;}
  box.innerHTML = "";
  data.forEach(p=>{
    const div = document.createElement("div");
    div.className = "product";
    const urls = Array.isArray(p.image_urls) && p.image_urls.length ? p.image_urls : (p.image_url ? [p.image_url] : []);
    const img = urls.map(url => `<img src="${escapeHTML(url)}" alt="">`).join("");
    div.innerHTML = `${img}
      <strong>${escapeHTML(p.name)}</strong><br>
      Price: ${escapeHTML(p.price)}<br>
      Category: ${escapeHTML(p.category)}<br>
      <button onclick="editProduct(${p.id})">Edit</button>
      <button class="delete" onclick="deleteProduct(${p.id})">Delete</button>`;
    box.appendChild(div);
  });
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

async function saveProduct(){
  const name = document.getElementById("name").value.trim();
  const price = document.getElementById("price").value.trim();
  const category = document.getElementById("category").value;
  const discountPercent = Number(document.getElementById("discountPercent").value);
  const audience = document.getElementById("audience").value;
  const description = document.getElementById("description").value.trim();
  const files = Array.from({length:10}, (_,i) => document.getElementById("photo"+(i+1)).files[0]).filter(Boolean);
  if(files.length > 10){alert("Please select a maximum of 10 photos.");return;}

  if(!name || !price){alert("Please enter product name and price.");return;}

  const button = document.querySelector("#dashboard button[onclick='saveProduct()']");
  button.disabled = true;
  button.textContent = "Saving...";

  try{
    let image_urls = [...existingImageUrls];
    if(files.length){
      image_urls = [];
      for(const file of files){
        const ext = file.name.split(".").pop();
        const path = Date.now() + "-" + Math.random().toString(36).slice(2) + "." + ext;
        const {error:uploadError} = await db.storage.from("product-images").upload(path,file);
        if(uploadError) throw uploadError;
        image_urls.push(db.storage.from("product-images").getPublicUrl(path).data.publicUrl);
      }
    }
    const product = {name,price,category,audience,description,discount_percent:discountPercent,on_sale:discountPercent>0};
    if(image_urls.length){product.image_urls=image_urls;product.image_url=image_urls[0];}

    let result;
    if(editingId){
      result = await db.from("products").update(product).eq("id",editingId);
    }else{
      result = await db.from("products").insert(product);
    }
    if(result.error) throw result.error;

    alert("Product saved successfully!");
    clearForm();
    loadProducts();
  }catch(error){
    alert("Error: " + error.message);
  }finally{
    button.disabled = false;
    button.textContent = "Save Product";
  }
}

async function editProduct(id){
  const {data,error} = await db.from("products").select("*").eq("id",id).single();
  if(error){alert(error.message);return;}
  editingId = id;
  document.getElementById("name").value = data.name || "";
  document.getElementById("price").value = data.price || "";
  document.getElementById("category").value = data.category || "Other";
  document.getElementById("discountPercent").value = String(data.discount_percent || 0);
  document.getElementById("audience").value = data.audience || "All";
  document.getElementById("description").value = data.description || "";
  for(let i=1;i<=10;i++) document.getElementById("photo"+i).value = "";
  existingImageUrls = Array.isArray(data.image_urls) && data.image_urls.length ? data.image_urls : (data.image_url ? [data.image_url] : []);
  showPhotoPreview(existingImageUrls);
  document.getElementById("formTitle").textContent = "Edit Product";
  window.scrollTo(0,0);
}

async function deleteProduct(id){
  if(!confirm("Are you sure you want to delete this product?")) return;
  const {error} = await db.from("products").delete().eq("id",id);
  if(error){alert(error.message);return;}
  alert("Product deleted.");
  loadProducts();
}

function clearForm(){
  editingId = null;
  document.getElementById("name").value = "";
  document.getElementById("price").value = "";
  document.getElementById("discountPercent").value = "0";
  document.getElementById("description").value = "";
  for(let i=1;i<=10;i++) document.getElementById("photo"+i).value = "";
  existingImageUrls = [];
  showPhotoPreview([]);
  document.getElementById("formTitle").textContent = "Add New Product";
}


function showPhotoPreview(urls){
  const box = document.getElementById("photoPreview");
  if(!box) return;
  box.innerHTML = "";
  urls.forEach(url => {
    const img = document.createElement("img");
    img.src = url;
    img.alt = "Product photo";
    box.appendChild(img);
  });
}

for(let i=1;i<=10;i++){
  document.getElementById("photo"+i).addEventListener("change", () => {
    const files = Array.from({length:10}, (_,j) => document.getElementById("photo"+(j+1)).files[0]).filter(Boolean);
    const box = document.getElementById("photoPreview");
    box.innerHTML = "";
    existingImageUrls.forEach(url => {
      const img = document.createElement("img");
      img.src = url;
      img.alt = "Existing product photo";
      box.appendChild(img);
    });
    files.forEach(file => {
      const img = document.createElement("img");
      img.src = URL.createObjectURL(file);
      img.alt = "New product photo";
      box.appendChild(img);
    });
  });
}

checkLogin();
</script>
</body>
</html>
