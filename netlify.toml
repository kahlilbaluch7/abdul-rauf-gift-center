[build]
  publish = "."
  functions = "netlify/functions"

# The Supabase publishable key is meant to be public (it is used in the
# storefront and admin pages), so the secret scanner must not fail builds on it.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_ANON_KEY"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]

[[redirects]]
  from = "/index-multiple-photos"
  to = "/"
  status = 301

[[redirects]]
  from = "/admin-10-separate-photo-inputs"
  to = "/admin"
  status = 301

  [[redirects]]
  from = "/p/*"
  to = "/.netlify/functions/product-share?id=:splat"
  status = 200
  force = true
